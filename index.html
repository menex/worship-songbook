<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songbook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#063986">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songbook">
<script>
  // Set theme + text size before first paint so reloads never flash the wrong look.
  (function(){
    try{
      var t = localStorage.getItem("songbookTheme");
      if(!t){ t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
      if(t === "dark"){ document.documentElement.setAttribute("data-theme", "dark"); }
    }catch(e){}
    try{
      var s = localStorage.getItem("songbookTextSize");
      if(s === "sm" || s === "lg"){ document.documentElement.setAttribute("data-textsize", s); }
    }catch(e){}
  })();
</script>
<style>
  :root{
    --dark:#26282c;
    --navy:#1d3f72;
    --blue:#2f6fdb;
    --blue-dark:#1d3f72;
    --bg:#ffffff;
    --text:#1a1a1a;
    --muted:#8a8f98;
    --border:#e4e6ea;
    --panel-bg:#ffffff;
    --surface:#ffffff;
    --surface-hover:#f0f1f3;
    --surface-alt:#f6f7f9;
    --input-border:#cfd6e0;
    --accent-soft:#eef2f8;
    --danger-border:#f0c9c9;
    --danger-hover:#fdf2f2;
    --success-bg:#eaf7ec;
    --success-text:#1c7c34;
    --neutral-badge-bg:#f3f4f6;
    --overlay:rgba(0,0,0,.35);
    --shadow:rgba(0,0,0,.15);
    --modal-shadow:rgba(0,0,0,.2);
    --lyric-size:17px;
    --chord-size:14px;
    --section-size:16px;
    color-scheme:light;
  }
  html[data-textsize="sm"]{ --lyric-size:15px; --chord-size:12.5px; --section-size:14px; }
  html[data-textsize="lg"]{ --lyric-size:20px; --chord-size:16.5px; --section-size:19px; }
  html[data-theme="dark"]{
    --dark:#e7e9ec;
    --navy:#6fa0e6;
    --blue:#7fb2ff;
    --blue-dark:#5488ce;
    --bg:#15171b;
    --text:#e7e9ec;
    --muted:#9aa1ab;
    --border:#2e3239;
    --panel-bg:#1b1e24;
    --surface:#1b1e24;
    --surface-hover:#262a31;
    --surface-alt:#20232a;
    --input-border:#3a3f48;
    --accent-soft:#20293a;
    --danger-border:#5c2c2c;
    --danger-hover:#2c1c1c;
    --success-bg:#173324;
    --success-text:#5fd382;
    --neutral-badge-bg:#262a31;
    --overlay:rgba(0,0,0,.55);
    --shadow:rgba(0,0,0,.4);
    --modal-shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);transition:background .15s ease,color .15s ease;}
  #app{height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  button,.icon-btn,.btn,.gate-btn,.menu-row,.lib-row,.mini-btn,.switch,.picker-row,.new-song-btn{touch-action:manipulation;}
  button,.menu-header,.app-header,.new-song-btn,.gate-btn strong{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}

  /* ---------- Header ---------- */
  .app-header{
    background:#063986;
    color:#fff;
    display:flex;
    align-items:center;
    padding:0 10px;
    height:58px;
    flex:0 0 auto;
    gap:6px;
  }
  .app-header .left-group{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
  .app-header .title{flex:2;text-align:center;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .app-header .right-group{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:8px;}
  .icon-btn{background:none;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:8px;border-radius:8px;opacity:.9;}
  .icon-btn:hover{opacity:1;background:rgba(255,255,255,.08);}
  .icon-btn:active{background:rgba(255,255,255,.16);}
  .icon-btn svg{width:22px;height:22px;}
  .key-control{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;white-space:nowrap;}
  .key-control button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;}
  .key-control button:hover{background:rgba(255,255,255,.15);}
  .key-control button:active{background:rgba(255,255,255,.25);}
  .key-label{min-width:16px;text-align:center;opacity:.95;font-size:16px;}

  /* ---------- Song viewer ---------- */
  .content-area{flex:1;overflow-y:auto;position:relative;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:14px;padding:40px;text-align:center;}
  .empty-state button{background:var(--navy);color:#fff;border:none;padding:12px 22px;border-radius:24px;font-size:15px;cursor:pointer;}

  .song-content{
    columns: 300px 3;
    column-gap: 48px;
    column-rule: 1px solid var(--border);
    padding: 30px 40px 60px;
  }
  .song-section{break-inside:avoid;margin-bottom:34px;}
  .section-label{font-weight:800;font-size:var(--section-size);letter-spacing:.4px;margin-bottom:14px;text-transform:uppercase;}
  .lyric-line{margin-bottom:6px;line-height:2.1;white-space:normal;font-size:var(--lyric-size);}
  .lyric-line.blank{height:14px;}
  .chord-pair{display:inline-block;position:relative;padding-top:1.15em;vertical-align:bottom;}
  .chord-pair .chord{position:absolute;top:0;left:0;color:var(--blue);font-weight:700;font-size:var(--chord-size);white-space:nowrap;}
  .chord-pair .lyric{white-space:pre;}
  .lyric-only-line{white-space:pre-wrap;font-size:var(--lyric-size);}
  .chord-only-line{white-space:normal;}
  .chord-badge{display:inline-block;color:var(--blue);font-weight:700;font-size:var(--chord-size);margin-right:.85em;}

  /* ---------- Edit screen ---------- */
  .edit-meta{
    display:flex;align-items:center;gap:20px;
    padding:14px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  .edit-meta .song-name-input{
    border:none;font-size:20px;font-weight:500;flex:1.4;min-width:180px;outline:none;background:transparent;
  }
  .edit-meta select{
    border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:14px;background:var(--surface);color:var(--text);
  }
  .edit-meta label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .edit-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
  .edit-body textarea{
    flex:1;min-height:320px;width:100%;border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--bg);color:var(--text);
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:14.5px;line-height:1.8;resize:vertical;outline:none;
  }
  .edit-hint{font-size:12.5px;color:var(--muted);background:var(--surface-alt);border-radius:8px;padding:10px 14px;}
  .edit-hint code{background:var(--surface-hover);padding:1px 5px;border-radius:4px;}
  .edit-footer{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid var(--border);}
  .edit-footer .left-actions label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);}
  .edit-footer .right-actions{display:flex;gap:10px;}
  .btn{border:none;border-radius:22px;padding:12px 22px;font-size:15px;cursor:pointer;font-weight:500;min-height:44px;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{filter:brightness(0.88);}
  .btn-secondary{background:var(--surface-hover);color:var(--text);}
  .btn-secondary:hover{filter:brightness(0.94);}
  .btn-danger{background:var(--surface);color:#e05a5a;border:1px solid var(--danger-border);}
  .btn-danger:hover{background:var(--danger-hover);}

  /* ---------- Menu drawer ---------- */
  .overlay{
    position:absolute;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:20;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .menu-drawer{
    position:absolute;top:0;left:0;bottom:0;width:min(420px,88%);background:var(--surface);
    transform:translateX(-100%);transition:transform .22s ease;z-index:21;
    display:flex;flex-direction:column;box-shadow:2px 0 18px var(--shadow);
  }
  .menu-drawer.open{transform:translateX(0);}
  .menu-header{background:#063986;color:#fff;padding:14px 12px 14px 20px;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;}
  .menu-header h2{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px;}
  .menu-header button{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1;min-width:44px;min-height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .menu-header button:hover{background:rgba(255,255,255,.1);}
  .menu-body{flex:1;overflow-y:auto;padding:16px 20px 90px;background:var(--surface);color:var(--text);}
  .search-wrap{position:relative;margin-bottom:18px;}
  .search-wrap input{
    width:100%;padding:13px 42px 13px 18px;border-radius:24px;border:2px solid var(--input-border);font-size:16px;outline:none;background:var(--bg);color:var(--text);min-height:48px;
  }
  .search-wrap input:focus{border-color:var(--text);}
  .search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:17px;color:var(--muted);cursor:pointer;min-width:38px;min-height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .search-clear:hover{background:var(--surface-hover);}
  .search-results-empty{color:var(--muted);font-size:14px;margin-bottom:10px;}
  .menu-section{margin-bottom:26px;}
  .menu-section-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--dark);padding-bottom:6px;margin-bottom:8px;}
  .menu-section-head h3{margin:0;font-size:14px;font-weight:800;letter-spacing:.4px;color:var(--navy);text-transform:uppercase;}
  .menu-section-head .add-link{color:var(--text);font-size:14.5px;font-weight:600;background:none;border:none;cursor:pointer;padding:10px 4px;min-height:44px;}
  .menu-empty{color:var(--muted);font-size:14px;padding:6px 0;}
  .menu-row{
    display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--surface-hover);min-height:36px;
  }
  .menu-row .idx{color:var(--muted);font-size:14px;width:16px;}
  .menu-row .row-title{flex:1;color:var(--text);font-size:16px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0;}
  .menu-row .row-title:hover{text-decoration:underline;}
  .menu-row .key-badge{color:var(--muted);font-size:14px;width:18px;text-align:center;}
  .menu-row .mini-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;min-width:36px;min-height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .menu-row .mini-btn:hover{color:var(--text);background:var(--surface-hover);}
  .menu-row .mini-btn svg{width:16px;height:16px;}
  .lib-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--surface-hover);cursor:pointer;min-height:36px;}
  .lib-row:hover .row-title{text-decoration:underline;}
  .lib-row .row-title{color:var(--text);font-size:16px;}
  .lib-row .key-badge{color:var(--muted);font-size:14px;}
  .event-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--surface-hover);min-height:36px;}
  .event-row .ev-name{font-size:15.5px;}
  .event-row .ev-date{color:var(--muted);font-size:13.5px;}
  .new-song-btn{
    position:absolute;left:20px;right:20px;bottom:18px;background:var(--navy);color:#fff;border:none;
    padding:17px;border-radius:26px;font-size:16.5px;font-weight:700;letter-spacing:.3px;cursor:pointer;min-height:52px;
  }
  .new-song-btn:hover{filter:brightness(0.88);}
  .picker-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:8px;background:var(--surface);}
  .picker-list .picker-row{padding:8px 12px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--surface-hover);color:var(--text);min-height:36px;display:flex;align-items:center;}
  .picker-list .picker-row:hover{background:var(--surface-hover);}
  .picker-list .picker-row:last-child{border-bottom:none;}

  /* modal */
  .modal-backdrop{position:absolute;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;}
  .modal{background:var(--surface);color:var(--text);border-radius:12px;padding:24px;width:min(400px,92%);max-height:88vh;overflow-y:auto;box-shadow:0 10px 40px var(--modal-shadow);}
  .modal h3{margin:0 0 14px;font-size:18px;}
  .modal input,.modal select{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);font-size:15.5px;margin-bottom:12px;outline:none;background:var(--bg);color:var(--text);min-height:46px;}
  .modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}

  /* ---------- Gate / loading ---------- */
  .loading-wrap{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;}
  .gate-wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--surface-alt);}
  .gate-card{max-width:380px;width:100%;text-align:center;}
  .gate-card h1{font-size:26px;margin:0 0 6px;color:var(--dark);}
  .gate-card p.sub{color:var(--muted);font-size:14.5px;margin:0 0 26px;line-height:1.5;}
  .gate-options{display:flex;flex-direction:column;gap:12px;}
  .gate-btn{padding:16px 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:15px;text-align:left;min-height:44px;}
  .gate-btn strong{display:block;font-size:16px;margin-bottom:2px;color:var(--text);}
  .gate-btn span{color:var(--muted);font-size:13.5px;}
  .gate-btn:hover{border-color:var(--blue);}
  .gate-form{display:flex;flex-direction:column;gap:12px;text-align:left;}
  .gate-form input{padding:14px 16px;border-radius:8px;border:1px solid var(--border);font-size:19px;letter-spacing:3px;text-transform:uppercase;text-align:center;background:var(--bg);color:var(--text);min-height:50px;}
  .gate-error{color:#e05a5a;font-size:13.5px;}
  .gate-code-display{font-size:30px;letter-spacing:5px;font-weight:800;color:var(--navy);background:var(--accent-soft);border-radius:10px;padding:18px;margin:18px 0;}
  .gate-secret-display{font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--accent-soft);border-radius:8px;padding:12px;margin:8px 0 18px;color:var(--navy);text-align:left;}
  .field-label{font-size:13px;color:var(--muted);display:block;text-align:left;margin-bottom:4px;}
  .role-badge{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:16px;text-align:left;}
  .role-badge.owner{background:var(--success-bg);color:var(--success-text);}
  .role-badge.viewer{background:var(--neutral-badge-bg);color:var(--muted);}
  .full-btn{width:100%;padding:14px;}

  /* ---------- Settings: toggles ---------- */
  .theme-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;min-height:44px;cursor:pointer;}
  .theme-toggle .toggle-label{font-size:15px;color:var(--text);}
  .switch{position:relative;display:inline-block;width:46px;height:27px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--surface-hover);border:1px solid var(--border);border-radius:27px;transition:.15s;}
  .switch .slider:before{position:absolute;content:"";height:19px;width:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch input:checked + .slider{background:var(--navy);}
  .switch input:checked + .slider:before{transform:translateX(19px);}

  .field-row-label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}
  .segmented{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px;}
  .segmented button{flex:1;background:var(--surface);color:var(--text);border:none;padding:12px 8px;font-size:14.5px;cursor:pointer;min-height:44px;border-left:1px solid var(--border);}
  .segmented button:first-child{border-left:none;}
  .segmented button.active{background:var(--navy);color:#fff;font-weight:600;}

  @media (max-width:520px){
    .song-content{columns:1;padding:20px;}
    .app-header .title{font-size:15px;}
  }
  /* Tablet portrait/landscape: a bit more breathing room than phone, capped so lines of
     lyrics don't stretch so wide they're hard to track from a music stand's distance. */
  @media (min-width:521px) and (max-width:1023px){
    .song-content{padding:30px 44px 60px;}
  }
  @media (min-width:1024px){
    .song-content{padding:36px 64px 70px;column-gap:56px;}
    .menu-drawer{width:min(420px,40%);}
  }
  /* Landscape tablets/phones: header can get cramped when the on-screen keyboard or a
     notch eats vertical space — keep touch targets but trim a little padding. */
  @media (max-height:420px) and (orientation:landscape){
    .app-header{height:50px;}
    .menu-header{padding:10px 12px 10px 18px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  /* ============ SUPABASE CONFIG ============ */
  var SUPABASE_URL = "https://hllolzzgmiqvrnnhywzs.supabase.co";
  var SUPABASE_KEY = "sb_publishable_F79FCrztcNQ28kaRjJWvfw_jhgTmQA1";

  function ownerSecretKey(code){ return "songbookOwnerSecret_" + code; }

    else { document.documentElement.removeAttribute("data-theme"); }
    safeSet(THEME_STORAGE_KEY, theme);
  }

  var TEXTSIZE_STORAGE_KEY = "songbookTextSize";
  function currentTextSize(){
    var a = document.documentElement.getAttribute("data-textsize");
    return (a === "sm" || a === "lg") ? a : "md";
  }
  function applyTextSize(size){
    if(size === "sm" || size === "lg"){ document.documentElement.setAttribute("data-textsize", size); }
    else { document.documentElement.removeAttribute("data-textsize"); }
    safeSet(TEXTSIZE_STORAGE_KEY, size);
  }

  // Screen Wake Lock: keeps the tablet's display from sleeping while the songbook is open —
  // useful when it's propped on a stand during a set and nobody's touching it between songs.
  // Defaults on; auto-releases when the tab is hidden (per spec) and we reacquire on return.
  var WAKELOCK_STORAGE_KEY = "songbookWakeLock";

  function wakeLockSupported(){ return typeof navigator !== "undefined" && !!navigator.wakeLock; }
  function wakeLockEnabled(){ var v = safeGet(WAKELOCK_STORAGE_KEY); return v === "off" ? false : true; }
  function requestWakeLock(){
    if(!wakeLockSupported() || !wakeLockEnabled() || wakeLockSentinel) return;

      wakeLockSentinel = sentinel;
      sentinel.addEventListener("release", function(){ wakeLockSentinel = null; });
    }).catch(function(){ /* denied/unsupported in this context — silently ignore */ });
  }
  function releaseWakeLock(){
    if(wakeLockSentinel){ try{ wakeLockSentinel.release(); }catch(e){} wakeLockSentinel = null; }
  }
  function setWakeLockEnabled(on){

    if(on){ requestWakeLock(); } else { releaseWakeLock(); }
  }
  if(typeof document !== "undefined"){
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "visible" && APP_STAGE === "app"){ requestWakeLock(); }
    });
  }

  var NOTES_SHARP = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var NOTES_FLAT  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  var ALL_KEYS = NOTES_SHARP;

  /* ============ APP STATE ============ */
  var APP_STAGE = "loading"; // loading | gate | app
  var GATESTATE = { mode:null, error:null, code:null, inputValue:"" };
  var SPACE_CODE = null;
  var OWNER_SECRET = null;
  var CHANNEL = null;
  var DB = null;
  var UISTATE = { menuOpen:false, search:"", modal:null, editingId:null, columns:"auto", showOwnerUnlock:false, ownerKeyError:null };
  function isOwner(){ return !!OWNER_SECRET; }

  // Personal, device-only key overrides for viewers (never synced to Supabase).
  // Owners always see/control the shared key directly, so this is ignored for them.
  var LOCAL_KEYS = {};
  function loadLocalKeys(code){
    try{ var raw = safeGet(localKeysStorageKey(code)); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
  }
  function saveLocalKeys(){
    if(!SPACE_CODE) return;
    safeSet(localKeysStorageKey(SPACE_CODE), JSON.stringify(LOCAL_KEYS));
  }
  function getDisplayKey(song){
    if(isOwner()) return song.currentKey;
    return (LOCAL_KEYS && LOCAL_KEYS[song.id]) || song.currentKey;
  }

  // Seed content for new songbooks now lives server-side in the create_space_with_seed
  // Postgres function, so it can be inserted atomically alongside the owner secret.

  /* ============ HELPERS ============ */
  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  // Escapes text, then turns **text** into <strong>text</strong>. Escaping first keeps
  // this safe against HTML injection while still letting the ** markers do their job.
  function applyBold(s){
    return escapeHtml(s).replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
  }
  function findSong(id){
    if(!DB) return null;
    for(var i=0;i<DB.songs.length;i++){ if(DB.songs[i].id===id) return DB.songs[i]; }
    return null;
  }
  function generateCode(){
    var alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no O/0/I/1
    var out = "";
    for(var i=0;i<6;i++){ out += alphabet[Math.floor(Math.random()*alphabet.length)]; }
    return out;
  }
  function rowToSong(row){
    return {
      id: row.id, title: row.title, originalKey: row.original_key, currentKey: row.current_key,
      format: row.format, content: row.content, inProgress: row.in_progress
    };
  }
  function rowToSetlistItem(row){
    return { id: row.id, songId: row.song_id, position: row.position };
  }
  function rowToEvent(row){
    return { id: row.id, name: row.name, date: row.event_date || "" };
  }

  /* ============ CHORD TRANSPOSE ============ */
  function keyIndex(key){
    var i = NOTES_SHARP.indexOf(key);
    if(i>=0) return i;
    i = NOTES_FLAT.indexOf(key);
    return i>=0 ? i : 0;
  }
  function transposeChord(chord, semitones, useFlats){
    if(semitones===0) return chord;
    if(chord.indexOf("/")>-1){
      var parts = chord.split("/");
      return transposeChord(parts[0], semitones, useFlats) + "/" + transposeChord(parts[1], semitones, useFlats);
    }
    var m = chord.match(/^([A-G])(#|b)?(.*)$/);
    if(!m) return chord;
    var root = m[1] + (m[2]||"");
    var suffix = m[3]||"";
    var idx = keyIndex(root);
    var newIdx = (idx + semitones + 1200) % 12;
    var table = useFlats ? NOTES_FLAT : NOTES_SHARP;
    return table[newIdx] + suffix;
  }
  function semitoneDiff(fromKey, toKey){
    return keyIndex(toKey) - keyIndex(fromKey);
  }

  /* ============ CHORD SHEET IMPORT (chords-above-lyrics -> [Chord]lyric) ============ */
  // Converts a classic "chord line above lyric line" sheet (the common copy/paste
  // format for worship chord charts) into this app's inline [Chord]lyric markup,
  // and turns ALL-CAPS label lines like "CORO:" into "## " section headers.
  function isChordToken(tok){
    return /^[A-G](#|b)?(maj7|maj|min7|min|dim7|dim|aug|sus2|sus4|sus|add9|add|m7|m|-)?[0-9]*(\/[A-G](#|b)?)?$/.test(tok);
  }
  // A "+"-joined run like "G+D+Am" represents 2+ chords meant to land on the exact same
  // beat/word (a quick chord run right before a downbeat) — see bracketsToChordOverLyric.
  function isChordClusterToken(tok){
    var parts = tok.split("+");
    return parts.length > 1 && parts.every(isChordToken);
  }
  function isChordLine(line){
    var t = line.trim();
    if(!t) return false;
    var toks = t.split(/\s+/);
    return toks.every(function(tok){ return isChordToken(tok) || isChordClusterToken(tok); });
  }
  function isLabelLine(line){
    var t = line.trim();
    if(!t) return false;
    if(isChordLine(line)) return false;
    return /^[A-ZÀ-Ý0-9][A-ZÀ-Ý0-9\s]*:$/.test(t);
  }
  // Keeps saved song content tidy regardless of how it got typed/pasted/edited: no blank
  // line directly under a "## Section" header (renders as dead space at the top of the
  // section), no runs of 2+ blank lines back to back, and no leading/trailing blank lines.
  // A single blank line between two content lines elsewhere is left alone — that's a
  // deliberate visual break within a section, not a bug.
  function normalizeSongContent(text){
    var lines = String(text||"").replace(/\r\n/g, "\n").split("\n");
    var out = [];
    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      if(line.trim() === ""){
        if(out.length === 0) continue;
        var prev = out[out.length-1];
        if(prev.trim() === "") continue;
        if(/^##\s+/.test(prev)) continue;
        out.push("");
      } else {
        out.push(line);
      }
    }
    while(out.length && out[out.length-1].trim() === ""){ out.pop(); }
    return out.join("\n");
  }
  // Resolves the column a chord lands on. If `col` lands exactly on whitespace (the gap
  // between words — very common, since chord sheets are typically typed with the chord
  // centered in the blank space before the syllable it belongs to), skip forward past the
  // whitespace to the start of the next word — leaving it on the space would glue the
  // chord to the end of the PREVIOUS word instead (e.g. "POR[C] QUE" instead of the
  // intended "POR [C]QUE"). Otherwise the column is trusted as-is, mid-word included:
  // chord sheets legitimately place a chord partway through a word for a held syllable
  // (e.g. "re[G]lieved", "salvas -[D]te"), and snapping those back to the word's start
  // would quietly destroy that precision.
  function snapToWordStart(chars, col){
    if(col <= 0) return 0;
    if(col >= chars.length) return chars.length;
    if(chars[col] === ' '){
      var k = col;
      while(k < chars.length && chars[k] === ' '){ k++; }
      return k;
    }
    return col;
  }
  function convertChordSheet(raw){
    var lines = String(raw).replace(/\r\n/g, "\n").split("\n");
    var out = [];
    var i = 0;
    while(i < lines.length){
      var line = lines[i];
      if(line.trim() === ""){ out.push(""); i++; continue; }
      if(isLabelLine(line)){
        out.push("## " + line.trim().replace(/:$/, ""));
        i++; continue;
      }
      if(isChordLine(line)){
        var nextLine = lines[i+1];
        var lyricAvailable = (i+1 < lines.length) && nextLine.trim() !== "" && !isChordLine(nextLine) && !isLabelLine(nextLine);
        if(!lyricAvailable){
          // No lyric line to attach these chords to (e.g. a standalone chord-progression
          // reference line like "E  B  A  E"). Leave it as plain text rather than
          // collapsing it into meaningless brackets with no lyric underneath.
          out.push(line);
          i++;
          continue;
        }
        var chordMatches = [];
        var re = /\S+/g, m, idx = 0;
        while((m = re.exec(line))){
          if(isChordClusterToken(m[0])){
            // Expand a "+"-joined cluster into its individual chords, all at this same
            // column — see bracketsToChordOverLyric for why these get written this way.
            m[0].split("+").forEach(function(part){ chordMatches.push({chord:part, col:m.index, idx:idx++}); });
          } else {
            chordMatches.push({chord:m[0], col:m.index, idx:idx++});
          }
        }
        var lyricLine = nextLine;
        var chars = lyricLine.split("");
        // Chord sheets are typed with the chord's character column roughly matching the
        // lyric character column it sits above — the standard plain-text chord-sheet
        // convention. Snap each chord's raw column to its resolved position.
        chordMatches.forEach(function(cm){
          cm.col = snapToWordStart(chars, Math.min(cm.col, chars.length));
        });
        var sorted = chordMatches.slice().sort(function(a,b){
          if(b.col !== a.col) return b.col - a.col;
          return b.idx - a.idx;
        });
        sorted.forEach(function(cm){
          var insertion = "[" + cm.chord + "]";
          var pos = Math.min(cm.col, chars.length);
          chars.splice(pos, 0, insertion);
        });
        out.push(chars.join(""));
        i += 2;
        continue;
      }
      out.push(line);
      i++;
    }
    return out.join("\n");
  }
  // The inverse of convertChordSheet: takes this app's storage format ([Chord]lyric,
  // inline brackets) and expands it back into a plain two-line chord-over-lyric sheet —
  // chord line above, lyric line below — for display in the edit textarea. Section
  // headers ("## ..."), blank lines, and plain lyric-only lines pass through untouched.
  function bracketsToChordOverLyric(content){
    var lines = String(content||"").replace(/\r\n/g, "\n").split("\n");
    var out = [];
    lines.forEach(function(line){
      if(/^##\s+/.test(line) || line.trim() === "" || line.indexOf("[") === -1){
        out.push(line);
        return;
      }
      var tokens = line.split(/\[([^\]]+)\]/);
      // Build a flat list of text/chord parts first (folding non-chord brackets like
      // "[Final]" back in as literal text) so we can tell which chords are genuinely
      // back-to-back with nothing between them — those are a stack meant for one word/
      // beat (e.g. "[D][C]Jesús") and get written as a single "D+C" cluster token below,
      // rather than as separate columns that would otherwise fight for the same spot.
      var parts = [{ type:"text", value: tokens[0] || "" }];
      for(var i=1;i<tokens.length;i+=2){
        if(isChordToken(tokens[i])){ parts.push({ type:"chord", value: tokens[i] }); }
        else { parts.push({ type:"text", value: "[" + tokens[i] + "]" }); }
        var after = tokens[i+1] || "";
        if(after !== "" || parts[parts.length-1].type !== "chord"){ parts.push({ type:"text", value: after }); }
      }
      var lyricPlain = "";
      var chordPositions = [];
      var p = 0;
      while(p < parts.length){
        if(parts[p].type === "text"){ lyricPlain += parts[p].value; p++; continue; }
        var col = lyricPlain.length;
        var cluster = [parts[p].value];
        p++;
        while(p < parts.length && parts[p].type === "chord"){ cluster.push(parts[p].value); p++; }
        chordPositions.push({ chord: cluster.join("+"), col: col });
      }
      var chordChars = [];
      var cursor = 0;
      chordPositions.forEach(function(cp){
        var col = Math.max(cp.col, cursor);
        while(chordChars.length < col){ chordChars.push(" "); }
        for(var k=0;k<cp.chord.length;k++){ chordChars[col+k] = cp.chord[k]; }
        cursor = col + cp.chord.length + 1; // at least one space before the next chord
      });
      var chordLine = chordChars.join("");
      if(chordLine.trim() !== ""){ out.push(chordLine); }
      out.push(lyricPlain);
    });
    return out.join("\n");
  }

  /* ============ BULK IMPORT ============ */
  // Multi-song text format:
  //   # Song Title
  //   Key: G                      (optional, defaults to C)
  //
  //   [G]lyrics... (or a raw chords-above-lyrics sheet — either works)
  //
  //   ---                          (optional divider; a blank line + next "# Title" also works)
  //
  //   # Next Song Title
  //   ...
  // Slightly more lenient than looksLikeChordSheet: each bulk-import block is already an
  // isolated song, so even a single chord line (e.g. a one-line bridge) should convert.
  function looksLikeChordSheetLenient(text){
    if(/\[[A-G][^\]]*\]/.test(text)) return false;
    var lines = String(text).replace(/\r\n/g, "\n").split("\n");
    var nonEmpty = lines.filter(function(l){ return l.trim() !== ""; });
    if(nonEmpty.length < 2) return false;
    var chordLineCount = nonEmpty.filter(isChordLine).length;
    return chordLineCount >= 1 && (chordLineCount / nonEmpty.length) >= 0.2;
  }
  function normalizeKeyInput(raw){
    if(!raw) return "C";
    var k = String(raw).trim();
    if(!k) return "C";
    k = k.charAt(0).toUpperCase() + k.slice(1).toLowerCase();
    if(NOTES_SHARP.indexOf(k) > -1) return k;
    if(NOTES_FLAT.indexOf(k) > -1) return k;
    return "C";
  }
  function parseBulkSongs(raw){
    var lines = String(raw).replace(/\r\n/g, "\n").split("\n");
    var blocks = [];
    var current = null;
    lines.forEach(function(line){
      var titleMatch = line.match(/^#\s+(.+?)\s*$/); // single "# " header; "## " (sections) won't match
      if(titleMatch){
        if(current) blocks.push(current);
        current = { title: titleMatch[1], key: null, contentLines: [] };
        return;
      }
      if(!current) return; // ignore any preamble before the first "# Title"
      if(current.key === null && current.contentLines.length === 0){
        var keyMatch = line.match(/^Key:\s*([A-Ga-g](#|b)?)\s*$/);
        if(keyMatch){ current.key = keyMatch[1]; return; }
      }
      if(/^-{3,}\s*$/.test(line.trim())) return; // divider line between songs
      current.contentLines.push(line);
    });
    if(current) blocks.push(current);

    return blocks.map(function(b){
      var contentLines = b.contentLines.slice();
      while(contentLines.length && contentLines[0].trim() === "") contentLines.shift();
      while(contentLines.length && contentLines[contentLines.length-1].trim() === "") contentLines.pop();
      var content = contentLines.join("\n");
      if(looksLikeChordSheetLenient(content)){ content = convertChordSheet(content); }
      content = normalizeSongContent(content);
      var key = normalizeKeyInput(b.key);
      return {
        title: b.title.trim() || "Untitled Song",
        originalKey: key,
        content: content
      };
    }).filter(function(s){ return s.title; });
  }
  function doBulkImportFromText(raw){
    if(!isOwner()){
      UISTATE.modal = { type:"bulk", error:"This device doesn't have edit access, so it can't import songs. Unlock editing in Settings first.", text: raw };
      render();
      return;
    }
    var songs = parseBulkSongs(raw);
    if(!songs.length){
      UISTATE.modal = { type:"bulk", error:'No songs found. Make sure each song starts with a line like "# Song Title".', text: raw };
      render();
      return;
    }
    UISTATE.modal = { type:"bulk", error:null, text: raw, importing:true, total: songs.length };
    render();
    var creates = songs.map(function(s){
      return Promise.resolve(sb.rpc("create_song", {
        p_space_id: SPACE_CODE, p_secret: OWNER_SECRET, p_title: s.title, p_original_key: s.originalKey,
        p_format: "chords", p_content: s.content, p_in_progress: true
      })).catch(function(e){ return { error: e }; }); // normalize network-level throws into the same {error} shape
    });
    Promise.all(creates).then(function(results){
      var successCount = 0, failCount = 0;
      results.forEach(function(res){
        if(!res || res.error){ failCount++; if(res) console.error(res.error); return; }
        var row = rowToSong(res.data);
        if(!findSong(row.id)){ DB.songs.push(row); }
        successCount++;
      });
      var msg = "Added " + successCount + " song" + (successCount===1?"":"s") + " to New Songs in Progress.";
      if(failCount) msg += " " + failCount + " failed — check your connection and try again.";
      // Stay open and show the result in the modal itself rather than relying on alert(),
      // which is silently blocked in some browsers/webviews and gives no feedback at all.
      UISTATE.modal = { type:"bulk", error:null, text:"", done:true, resultMsg: msg };
      render();
    }).catch(function(e){
      console.error("bulk import failed", e);
      UISTATE.modal = { type:"bulk", error:"Something went wrong during import. Please try again.", text: raw };
      render();
    });
  }

  /* ============ RENDER: SONG CONTENT ============ */
  function parseAndRenderContent(song, displayKey){
    var semis = semitoneDiff(song.originalKey, displayKey);
    var useFlats = displayKey.indexOf("b") > -1;
    var lines = song.content.split("\n");
    var html = "";
    var sectionOpen = false;

    lines.forEach(function(line){
      if(/^##\s+/.test(line)){
        if(sectionOpen) html += "</div>";
        var label = line.replace(/^##\s+/,"");
        html += '<div class="song-section"><div class="section-label">'+escapeHtml(label)+'</div>';
        sectionOpen = true;
        return;
      }
      if(!sectionOpen){ html += '<div class="song-section">'; sectionOpen = true; }
      if(line.trim()===""){
        html += '<div class="lyric-line blank"></div>';
        return;
      }
      if(song.format === "lyrics"){
        var plain = line.replace(/\[([^\]]+)\]/g,"");
        html += '<div class="lyric-line lyric-only-line">'+applyBold(plain)+'</div>';
        return;
      }
      // A standalone chord-progression line (e.g. an instrumental cue like "G  D  Am  C")
      // has no lyric underneath it to attach brackets to, so it's stored as plain text.
      // Render it as a row of highlighted chord badges instead of plain lyric text.
      if(line.indexOf("[") === -1 && isChordLine(line)){
        var badges = line.trim().split(/\s+/).map(function(tok){
          var parts = tok.split("+");
          return parts.map(function(part){
            return '<span class="chord-badge">'+escapeHtml(transposeChord(part, semis, useFlats))+'</span>';
          }).join("");
        }).join("");
        html += '<div class="lyric-line chord-only-line">'+badges+'</div>';
        return;
      }
      var tokens = line.split(/\[([^\]]+)\]/);
      var row = '<div class="lyric-line">';
      if(tokens[0]){
        row += '<span class="chord-pair"><span class="lyric">'+applyBold(tokens[0])+'</span></span>';
      }
      for(var i=1;i<tokens.length;i+=2){
        var chord = tokens[i];
        var lyric = tokens[i+1] || "";
        var newChord = transposeChord(chord, semis, useFlats);
        row += '<span class="chord-pair"><span class="chord">'+escapeHtml(newChord)+'</span><span class="lyric">'+applyBold(lyric || " ")+'</span></span>';
      }
      row += '</div>';
      html += row;
    });
    if(sectionOpen) html += "</div>";
    return html;
  }

  /* ============ ICONS ============ */
  var ICONS = {
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="16" rx="1"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="6" y1="12" x2="11" y2="12"/><path d="M14 15 L21 8 L23 10 L16 17 L13 18 Z"/></svg>',
    gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 6l7 10H5z"/></svg>',

    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>'
  };

  /* ============ RENDER: GATE / LOADING ============ */
  function loadingHtml(){
    return '<div class="loading-wrap">Loading your songbook&hellip;</div>';
  }

  function renderGate(){
    var g = GATESTATE;
    if(g.mode === "created"){
      return '<div class="gate-wrap"><div class="gate-card">'+
        '<h1>Songbook created</h1>'+
        '<p class="sub">There are two codes below — they do different things. Save both somewhere safe; neither can be recovered if lost.</p>'+
        '<span class="field-label">Access code — share freely, lets anyone view</span>'+
        '<div class="gate-code-display">'+escapeHtml(g.code)+'</div>'+
        '<span class="field-label">Owner key — keep private, grants edit access</span>'+
        '<div class="gate-secret-display">'+escapeHtml(g.secret)+'</div>'+
        '<button class="btn btn-secondary full-btn" data-action="copy-owner-key" style="margin-bottom:10px;">Copy owner key</button>'+
        '<button class="btn btn-primary full-btn" data-action="gate-continue">Continue to Songbook</button>'+
      '</div></div>';
    }
    if(g.mode === "join"){
      return '<div class="gate-wrap"><div class="gate-card">'+
        '<h1>Join a songbook</h1>'+
        '<p class="sub">Enter the access code shared with you.</p>'+
        '<div class="gate-form">'+
          '<input id="join-code-input" maxlength="8" placeholder="e.g. 7F3K9Q" value="'+escapeHtml(g.inputValue||"")+'">'+
          (g.error ? '<div class="gate-error">'+escapeHtml(g.error)+'</div>' : '')+
          '<button class="btn btn-primary full-btn" data-action="gate-join-submit">Join</button>'+
          '<button class="btn btn-secondary full-btn" data-action="gate-back">Back</button>'+
        '</div>'+
      '</div></div>';
    }
    return '<div class="gate-wrap"><div class="gate-card">'+
      '<h1>Songbook</h1>'+
      '<p class="sub">Keep your set lists and songs in sync across every device.</p>'+
      '<div class="gate-options">'+
        '<button class="gate-btn" data-action="gate-create"><strong>Create a new songbook</strong><span>Start fresh and get a code to share</span></button>'+
        '<button class="gate-btn" data-action="gate-show-join"><strong>Join with a code</strong><span>Sync to a songbook someone else created</span></button>'+
      '</div>'+
    '</div></div>';

  /* ============ MAIN RENDER ============ */
  function render(){
    var app = document.getElementById("app");
    if(APP_STAGE === "loading"){ app.innerHTML = loadingHtml(); return; }
    if(APP_STAGE === "gate"){ app.innerHTML = renderGate(); return; }
    var body = DB.ui.view === "edit" ? renderEditView() : renderSongView();
    app.innerHTML = renderHeader() + body + renderMenu() + renderModal();
    applyColumnSetting();
    requestWakeLock();
    if(SPACE_CODE && DB){
      safeSet(cacheKey(SPACE_CODE), JSON.stringify(DB));
    }
  }

  function applyColumnSetting(){
    var el = document.querySelector(".song-content");
    if(el && UISTATE.columns === "1"){ el.style.columns = "1"; }
  }

  /* ============ SPACE / SYNC ============ */
  function subscribeRealtime(code){
    if(CHANNEL){ try{ sb.removeChannel(CHANNEL); }catch(e){} CHANNEL = null; }
    CHANNEL = sb.channel("space-"+code)
      .on("postgres_changes", {event:"*", schema:"public", table:"songs", filter:"space_id=eq."+code}, handleSongChange)
      .on("postgres_changes", {event:"*", schema:"public", table:"setlists", filter:"space_id=eq."+code}, handleSetlistChange)
      .on("postgres_changes", {event:"*", schema:"public", table:"setlist_items", filter:"space_id=eq."+code}, handleSetlistItemChange)
      .on("postgres_changes", {event:"*", schema:"public", table:"events", filter:"space_id=eq."+code}, handleEventChange)
      .subscribe();
  }

  function handleSongChange(payload){
    if(!DB) return;
    if(payload.eventType === "INSERT"){
      if(!findSong(payload.new.id)){
        DB.songs.push(rowToSong(payload.new));
        if(!DB.ui.currentSongId) DB.ui.currentSongId = payload.new.id;
        render();
      }
    } else if(payload.eventType === "UPDATE"){
      var s = findSong(payload.new.id);
      if(s){
        if(DB.ui.view === "edit" && UISTATE.editingId === s.id){ return; } // avoid clobbering an active edit
        var updated = rowToSong(payload.new);
        for(var k in updated){ s[k] = updated[k]; }
        render();
      }
    } else if(payload.eventType === "DELETE"){
      var id = payload.old.id;
      DB.songs = DB.songs.filter(function(x){return x.id!==id;});
      DB.setlist.items = DB.setlist.items.filter(function(it){return it.songId!==id;});
      if(DB.ui.currentSongId === id){
        DB.ui.currentSongId = DB.songs.length ? DB.songs[0].id : null;
        if(DB.ui.view === "edit") DB.ui.view = "song";
      }
      render();
    }
  }

  function handleSetlistChange(payload){
    if(!DB || !DB.setlist) return;
    if(payload.eventType === "UPDATE" && payload.new.id === DB.setlist.id){
      DB.setlist.name = payload.new.name;
      render();
    }
  }

  function handleSetlistItemChange(payload){
    if(!DB || !DB.setlist) return;
    if(payload.eventType === "INSERT"){
      if(!DB.setlist.items.some(function(it){return it.id===payload.new.id;})){
        DB.setlist.items.push(rowToSetlistItem(payload.new));
        DB.setlist.items.sort(function(a,b){return a.position-b.position;});
        render();
      }
    } else if(payload.eventType === "UPDATE"){
      var it = DB.setlist.items.find(function(x){return x.id===payload.new.id;});
      if(it){
        it.position = payload.new.position;
        DB.setlist.items.sort(function(a,b){return a.position-b.position;});
        render();
      }
    } else if(payload.eventType === "DELETE"){
      DB.setlist.items = DB.setlist.items.filter(function(x){return x.id!==payload.old.id;});
      render();
    }
  }

  function handleEventChange(payload){
    if(!DB) return;
    if(payload.eventType === "INSERT"){
      if(!DB.events.some(function(e){return e.id===payload.new.id;})){
        DB.events.push(rowToEvent(payload.new));
        DB.events.sort(function(a,b){return (a.date||"").localeCompare(b.date||"");});
        render();
      }
    } else if(payload.eventType === "UPDATE"){
      var ev = DB.events.find(function(x){return x.id===payload.new.id;});
      if(ev){ var u = rowToEvent(payload.new); ev.name=u.name; ev.date=u.date; render(); }
    } else if(payload.eventType === "DELETE"){
      DB.events = DB.events.filter(function(x){return x.id!==payload.old.id;});
      render();
    }
  }

  // Loads (or refreshes) a space's data. enterApp=false keeps APP_STAGE at "gate" (used for the post-create confirmation screen).
  function tryLoadSpace(code, enterApp){
    if(enterApp === undefined) enterApp = true;
    return sb.from("spaces").select("id").eq("id", code).maybeSingle().then(function(spaceRes){
      if(spaceRes.error || !spaceRes.data) return false;
      SPACE_CODE = code;
      OWNER_SECRET = safeGet(ownerSecretKey(code));
      LOCAL_KEYS = loadLocalKeys(code);
      UISTATE.showOwnerUnlock = false;
      UISTATE.ownerKeyError = null;
      return Promise.all([
        sb.from("songs").select("*").eq("space_id", code).order("title"),
        sb.from("setlists").select("*").eq("space_id", code).limit(1),
        sb.from("events").select("*").eq("space_id", code).order("event_date", {ascending:true})
      ]).then(function(results){
        var songsRes = results[0], setlistsRes = results[1], eventsRes = results[2];
        DB = {
          songs: (songsRes.data||[]).map(rowToSong),
          setlist: null,
          events: (eventsRes.data||[]).map(rowToEvent),
          ui: { currentSongId: null, view: "song" }
        };
        var setlistRow = (setlistsRes.data && setlistsRes.data[0]) || null;
        var ensureSetlist = setlistRow
          ? Promise.resolve(setlistRow)
          : sb.from("setlists").insert({space_id:code, name:"Sunday Set List"}).select().single().then(function(r){ return r.data; });
        return ensureSetlist.then(function(sl){
          return sb.from("setlist_items").select("*").eq("setlist_id", sl.id).order("position").then(function(itemsRes){
            DB.setlist = { id: sl.id, name: sl.name, items: (itemsRes.data||[]).map(rowToSetlistItem) };
            DB.ui.currentSongId = DB.songs.length ? DB.songs[0].id : null;
            safeSet(CODE_STORAGE_KEY, code);
            subscribeRealtime(code);
            if(enterApp){ APP_STAGE = "app"; }
            render();
            return true;
          });
        });
      });
    }).catch(function(e){
      console.error("tryLoadSpace failed", e);
      return false;
    });
  }

  function doCreateSpace(){
    APP_STAGE = "loading"; render();
    var code = generateCode();
    sb.from("spaces").select("id").eq("id", code).maybeSingle().then(function(check){
      if(check.data){ code = generateCode(); } // extremely unlikely collision; good enough for one retry
      return sb.rpc("create_space_with_seed", {p_id: code});
    }).then(function(res){
      if(res.error) throw res.error;
      var secret = res.data;
      OWNER_SECRET = secret;
      safeSet(ownerSecretKey(code), secret);
      return tryLoadSpace(code, false).then(function(ok){ return {ok:ok, secret:secret}; });
    }).then(function(result){
      // tryLoadSpace re-reads the owner secret from storage; if that write silently failed
      // (e.g. Safari private mode) force the freshly-created secret back so the creator
      // isn't downgraded to read-only immediately after making their own songbook.
      OWNER_SECRET = result.secret;
      if(result.ok){
        GATESTATE = { mode:"created", code:code, secret:result.secret, error:null };
        APP_STAGE = "gate";
      } else {
        GATESTATE = { mode:null, error:"Something went wrong creating your songbook. Please try again." };
        APP_STAGE = "gate";
      }
      render();
    }).catch(function(e){
      console.error("doCreateSpace failed", e);
      GATESTATE = { mode:null, error:"Something went wrong creating your songbook. Please try again." };
      APP_STAGE = "gate";
      render();
    });
  }

  function doJoinSpace(){
    var input = document.getElementById("join-code-input");
    var code = (input ? input.value : "").trim().toUpperCase();
    if(!code){ GATESTATE.error = "Enter a code."; render(); return; }
    APP_STAGE = "loading"; render();
    tryLoadSpace(code, true).then(function(ok){
      if(!ok){
        GATESTATE = { mode:"join", error:"No songbook found for that code.", inputValue:code };
        APP_STAGE = "gate";
        render();
      }
    });
  }

  function doSwitchSongbook(){
    if(!confirm("Switch to a different songbook? This device will stop syncing with the current one.")) return;
    if(CHANNEL){ try{ sb.removeChannel(CHANNEL); }catch(e){} CHANNEL = null; }
    safeRemove(CODE_STORAGE_KEY);
    SPACE_CODE = null; OWNER_SECRET = null; DB = null; LOCAL_KEYS = {};
    UISTATE.modal = null;
    UISTATE.showOwnerUnlock = false;
    UISTATE.ownerKeyError = null;
    GATESTATE = { mode:null, error:null, code:null, inputValue:"" };
    APP_STAGE = "gate";
    render();
  }

  function copyCodeToClipboard(){
    if(!SPACE_CODE) return;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(SPACE_CODE).catch(function(){});
    }
  }

  function copyOwnerKeyToClipboard(){
    if(!OWNER_SECRET) return;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(OWNER_SECRET).catch(function(){});
    }
  }

  function submitOwnerKey(){
    var input = document.getElementById("owner-key-input");
    var key = input ? input.value.trim() : "";
    if(!key){ UISTATE.ownerKeyError = "Enter a key."; render(); return; }
    sb.rpc("verify_owner_secret", {p_space_id: SPACE_CODE, p_secret: key}).then(function(res){
      if(res.error || !res.data){
        UISTATE.ownerKeyError = "That key doesn't match this songbook.";
        render();
        return;
      }
      OWNER_SECRET = key;
      safeSet(ownerSecretKey(SPACE_CODE), key);
      UISTATE.ownerKeyError = null;
      UISTATE.showOwnerUnlock = false;
      render();
    });
  }

  /* ============ ACTIONS (mutating, synced to Supabase) ============ */
  function openSong(id){
    DB.ui.currentSongId = id;
    DB.ui.view = "song";
    UISTATE.menuOpen = false;
    render();
  }

  function startEdit(id){
    UISTATE.editingId = id;
    DB.ui.view = "edit";
    UISTATE.menuOpen = false;
    render();
  }

  function createNewSong(){
    if(!isOwner()) return;
    sb.rpc("create_song", {
      p_space_id: SPACE_CODE, p_secret: OWNER_SECRET, p_title:"Untitled Song", p_original_key:"C",
      p_format:"chords", p_content: normalizeSongContent("## Verse 1\n[C]Type your lyrics and [G]chords here"), p_in_progress:true
    }).then(function(res){
      if(res.error){ console.error(res.error); return; }
      var s = rowToSong(res.data);
      DB.songs.push(s);
      startEdit(s.id);
    });
  }

  function saveSongFromForm(){
    if(!isOwner()) return;
    var s = findSong(UISTATE.editingId) || findSong(DB.ui.currentSongId);
    if(!s){ return; }
    var root = document.querySelector(".content-area");
    var rpcParams = { p_space_id: SPACE_CODE, p_secret: OWNER_SECRET, p_song_id: s.id };
    var changed = false;
    if(root){
      var titleEl = root.querySelector('[data-field="title"]');
      var formatEl = root.querySelector('[data-field="format"]');
      var keyEl = root.querySelector('[data-field="originalKey"]');
      var contentEl = root.querySelector('[data-field="content"]');
      var inProgEl = root.querySelector('[data-field="inProgress"]');
      if(titleEl){ s.title = titleEl.value.trim() || "Untitled Song"; rpcParams.p_title = s.title; changed = true; }
      if(formatEl){ s.format = formatEl.value; rpcParams.p_format = s.format; changed = true; }
      if(keyEl && keyEl.value !== s.originalKey){ s.originalKey = keyEl.value; s.currentKey = keyEl.value; rpcParams.p_original_key = s.originalKey; rpcParams.p_current_key = s.currentKey; changed = true; }
      if(contentEl){
        // The textarea shows plain chord-over-lyric text for "chords" format songs (see
        // renderEditView), so convert it back into this app's [Chord]lyric storage format
        // before saving. "lyrics" format has no chord lines to convert — save as typed.
        var raw = contentEl.value;
        s.content = normalizeSongContent(s.format === "chords" ? convertChordSheet(raw) : raw);
        rpcParams.p_content = s.content;
        changed = true;
      }
      if(inProgEl){ s.inProgress = inProgEl.checked; rpcParams.p_in_progress = s.inProgress; changed = true; }
    }
    DB.ui.currentSongId = s.id;
    DB.ui.view = "song";
    render();
    if(changed){
      sb.rpc("update_song", rpcParams).then(function(res){
        if(res.error) console.error(res.error);
      });
    }
  }

  function deleteSongAction(){
    if(!isOwner()) return;
    var id = UISTATE.editingId || DB.ui.currentSongId;
    if(!id || !confirm("Delete this song?")) return;
    DB.songs = DB.songs.filter(function(s){return s.id!==id;});
    DB.setlist.items = DB.setlist.items.filter(function(it){return it.songId!==id;});
    DB.ui.currentSongId = DB.songs.length ? DB.songs[0].id : null;
    DB.ui.view = "song";
    render();
    sb.rpc("delete_song", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_song_id:id}).then(function(res){
      if(res.error) console.error(res.error);
    });
  }

  function adjustKey(dir){
    var song = findSong(DB.ui.currentSongId);
    if(!song) return;
    var idx = keyIndex(getDisplayKey(song));
    idx = (idx + dir + 12) % 12;
    var newKey = ALL_KEYS[idx];

    if(isOwner()){
      song.currentKey = newKey;
      delete LOCAL_KEYS[song.id]; // this device now controls the shared key directly
      saveLocalKeys();
      render();
      sb.rpc("update_song", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_song_id:song.id, p_current_key:newKey}).then(function(res){
        if(res.error) console.error(res.error);
      });
    } else {
      // Personal, local-only transpose — never written to Supabase.
      LOCAL_KEYS[song.id] = newKey;
      saveLocalKeys();
      render();
    }
  }

  function pickSong(target, songId){
    UISTATE.modal = null;
    if(!isOwner()){ render(); return; }
    if(target === "setlist"){
      var pos = DB.setlist.items.length;
      sb.rpc("create_setlist_item", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_setlist_id:DB.setlist.id, p_song_id:songId, p_position:pos}).then(function(res){
        if(res.error){ console.error(res.error); render(); return; }
        DB.setlist.items.push(rowToSetlistItem(res.data));
        render();
      });
    } else {
      var s = findSong(songId);
      if(s){ s.inProgress = true; }
      render();
      sb.rpc("update_song", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_song_id:songId, p_in_progress:true}).then(function(res){
        if(res.error) console.error(res.error);
      });
    }
  }

  function moveSetlistItem(idx, dir){
    if(!isOwner()) return;
    var arr = DB.setlist.items;
    var j = idx + dir;
    if(j<0 || j>=arr.length) return;
    var a = arr[idx], b = arr[j];
    var posA = a.position, posB = b.position;
    a.position = posB; b.position = posA;
    arr.sort(function(x,y){return x.position-y.position;});
    render();
    Promise.all([
      sb.rpc("update_setlist_item_position", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_item_id:a.id, p_position:a.position}),
      sb.rpc("update_setlist_item_position", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_item_id:b.id, p_position:b.position})
    ]).then(function(results){
      results.forEach(function(r){ if(r.error) console.error(r.error); });
    });
  }

  function removeSetlistItem(idx){
    if(!isOwner()) return;
    var item = DB.setlist.items[idx];
    if(!item) return;
    DB.setlist.items.splice(idx,1);
    render();
    sb.rpc("delete_setlist_item", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_item_id:item.id}).then(function(res){
      if(res.error) console.error(res.error);
    });
  }

  function removeInProgress(songId){
    if(!isOwner()) return;
    var s = findSong(songId);
    if(!s) return;
    s.inProgress = false;
    render();
    sb.rpc("update_song", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_song_id:songId, p_in_progress:false}).then(function(res){
      if(res.error) console.error(res.error);
    });
  }

  function saveEventFromForm(){
    var nameEl = document.getElementById("ev-name");
    var dateEl = document.getElementById("ev-date");
    var name = nameEl ? nameEl.value.trim() : "";
    UISTATE.modal = null;
    if(!name || !isOwner()){ render(); return; }
    var date = dateEl ? dateEl.value : "";
    render();
    sb.rpc("create_event", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_name:name, p_event_date: date || null}).then(function(res){
      if(res.error){ console.error(res.error); return; }
      DB.events.push(rowToEvent(res.data));
      DB.events.sort(function(a,b){return (a.date||"").localeCompare(b.date||"");});
      render();
    });
  }

  function removeEventAction(idx){
    if(!isOwner()) return;
    var ev = DB.events[idx];
    if(!ev) return;
    DB.events.splice(idx,1);
    render();
    sb.rpc("delete_event", {p_space_id:SPACE_CODE, p_secret:OWNER_SECRET, p_event_id:ev.id}).then(function(res){
      if(res.error) console.error(res.error);
    });
  }

  /* ============ EVENT DELEGATION ============ */
  document.addEventListener("click", function(e){
    // [data-stop] (the modal card) marks a boundary that clicks shouldn't bubble past on
    // their way to an ancestor's [data-action] (the backdrop's close-modal). Whichever
    // matches first — an actionable element or a stop boundary — wins. Without this, any
    // click inside a modal that isn't itself a data-action element (e.g. a file input or
    // textarea) bubbles straight through to the backdrop and closes the modal instantly.
    var el = e.target.closest("[data-action], [data-stop]");
    if(!el || !el.hasAttribute("data-action")) return;
    var action = el.getAttribute("data-action");

    switch(action){
      // gate
      case "gate-create": doCreateSpace(); break;
      case "gate-show-join": GATESTATE = {mode:"join", error:null, inputValue:""}; render(); break;
      case "gate-back": GATESTATE = {mode:null, error:null}; render(); break;
      case "gate-join-submit": doJoinSpace(); break;
      case "gate-continue": APP_STAGE = "app"; GATESTATE = {mode:null, error:null}; render(); break;

      // app chrome
      case "open-menu": UISTATE.menuOpen = true; render(); break;
      case "close-menu": UISTATE.menuOpen = false; render(); break;
      case "open-song": openSong(el.getAttribute("data-id")); break;
      case "edit-current": startEdit(DB.ui.currentSongId); break;
      case "new-song": createNewSong(); break;
      case "key-up": adjustKey(1); break;
      case "key-down": adjustKey(-1); break;
      case "open-settings": UISTATE.modal = {type:"settings"}; render(); break;
      case "set-textsize": applyTextSize(el.getAttribute("data-size")); render(); break;
      case "close-modal": UISTATE.modal = null; render(); break;
      case "copy-code": copyCodeToClipboard(); break;
      case "copy-owner-key": copyOwnerKeyToClipboard(); break;
      case "toggle-owner-unlock": UISTATE.showOwnerUnlock = !UISTATE.showOwnerUnlock; UISTATE.ownerKeyError = null; render(); break;
      case "submit-owner-key": submitOwnerKey(); break;
      case "switch-songbook": doSwitchSongbook(); break;

      case "save-song": saveSongFromForm(); break;
      case "cancel-edit": DB.ui.view = "song"; render(); break;
      case "delete-song": deleteSongAction(); break;

      case "search-clear": UISTATE.search=""; render(); break;

      case "open-picker-setlist": UISTATE.modal = {type:"picker", target:"setlist"}; render(); break;
      case "open-picker-progress": UISTATE.modal = {type:"picker", target:"progress"}; render(); break;
      case "pick-song": pickSong(el.getAttribute("data-target"), el.getAttribute("data-id")); break;
      case "setlist-up": moveSetlistItem(parseInt(el.getAttribute("data-idx"),10), -1); break;
      case "setlist-down": moveSetlistItem(parseInt(el.getAttribute("data-idx"),10), 1); break;
      case "setlist-remove": removeSetlistItem(parseInt(el.getAttribute("data-idx"),10)); break;
      case "remove-in-progress": removeInProgress(el.getAttribute("data-id")); break;

      case "open-add-event": UISTATE.modal = {type:"event"}; render(); break;
      case "save-event": saveEventFromForm(); break;
      case "remove-event": removeEventAction(parseInt(el.getAttribute("data-idx"),10)); break;

      case "open-bulk-import":
        if(isOwner()){ UISTATE.modal = {type:"bulk", error:null, text:""}; render(); }
        break;
      case "run-bulk-import": {
        var bulkInput = document.getElementById("bulk-import-input");
        var bulkRaw = bulkInput ? bulkInput.value : "";
        if(!bulkRaw.trim()){
          UISTATE.modal = {type:"bulk", error:"Paste or upload some songs first.", text:bulkRaw};
          render();
          break;
        }
        doBulkImportFromText(bulkRaw);
        break;
      }
    }
  });

  document.addEventListener("input", function(e){
    if(e.target.getAttribute("data-action") === "search-input"){
      UISTATE.search = e.target.value;
      render();
      var input = document.querySelector('[data-action="search-input"]');
      if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      return;
    }
  });

  document.addEventListener("change", function(e){
    if(e.target.id === "set-theme"){
      applyTheme(e.target.checked ? "dark" : "light");
      return; // no render() needed — CSS variables handle the whole repaint
    }
    if(e.target.id === "set-wakelock"){
      setWakeLockEnabled(e.target.checked);
      return;
    }
    if(e.target.id === "set-columns"){
      UISTATE.columns = e.target.value;
      render();
      return;
    }
    if(e.target.id === "bulk-file-input"){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var importBtn = document.querySelector('[data-action="run-bulk-import"]');
      if(importBtn){ importBtn.disabled = true; importBtn.textContent = "Loading file…"; }
      var reader = new FileReader();
      reader.onload = function(){
        var ta = document.getElementById("bulk-import-input");
        if(ta){ ta.value = String(reader.result || ""); }
        if(importBtn){ importBtn.disabled = false; importBtn.textContent = "Import songs"; }
      };
      reader.onerror = function(){
        if(importBtn){ importBtn.disabled = false; importBtn.textContent = "Import songs"; }
        UISTATE.modal = { type:"bulk", error:"Couldn't read that file. Try pasting the text instead.", text:"" };
        render();
      };
      reader.readAsText(file);
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter" || !document.activeElement) return;
    if(document.activeElement.id === "join-code-input"){ doJoinSpace(); }
    if(document.activeElement.id === "owner-key-input"){ submitOwnerKey(); }
  });

  /* ============ BOOT ============ */
  (function boot(){
    var saved = safeGet(CODE_STORAGE_KEY);
    if(saved){
      var cached = safeGet(cacheKey(saved));
      if(cached){
        try{ DB = JSON.parse(cached); SPACE_CODE = saved; OWNER_SECRET = safeGet(ownerSecretKey(saved)); LOCAL_KEYS = loadLocalKeys(saved); APP_STAGE = "app"; render(); }catch(e){}
      }
      tryLoadSpace(saved, true).then(function(ok){
        if(!ok){
          safeRemove(CODE_STORAGE_KEY);
          DB = null; SPACE_CODE = null;
          GATESTATE = {mode:null, error:null};
          APP_STAGE = "gate";
          render();
        }
      });
    } else {
      APP_STAGE = "gate";
      render();
    }
  })();
})();
</script>
<script>
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>
